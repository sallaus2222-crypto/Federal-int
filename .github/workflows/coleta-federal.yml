name: Coleta Federal
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          pip install -r coletor/requirements.txt
          playwright install --with-deps chromium
      - name: Ler resultado oficial e enviar ao Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
        run: python coletor/coletar_caixa.py
